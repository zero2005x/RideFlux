version: 2

updates:
  # The five setup steps are duplicated between ci.yml and release.yml, so a
  # hand-edited version bump can easily land in one file and not the other.
  # Dependabot updates every reference in one grouped pull request instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      # One PR for all action bumps rather than one PR per action.
      github-actions:
        patterns:
          - "*"

  # Gradle dependency updates are intentionally not enabled here. The version
  # catalog in gradle/libs.versions.toml is supported, but on an Android
  # project it produces a steady stream of PRs; enable it by uncommenting once
  # the action updates above have settled into a routine.
  #
  # - package-ecosystem: gradle
  #   directory: /
  #   schedule:
  #     interval: monthly
  #   open-pull-requests-limit: 5
