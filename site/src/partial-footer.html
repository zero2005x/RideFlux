<footer class="site-footer">
  <div class="container">
    <div class="foot-grid">
      <div class="foot-brand">
        <a class="brand" href="{{v:home}}"><img src="{{v:root}}assets/icons/icon-192.png" width="32" height="32" alt=""><span>RideFlux</span></a>
        <p>{{t:footer.disclaimer}}</p>
      </div>
      <div>
        <h2>RideFlux</h2>
        <ul>
          <li><a href="{{v:play_url}}">Google Play</a></li>
          <li><a href="{{v:repo_url}}">{{p:footer.source}}</a></li>
          <li><a href="{{v:releases_url}}">GitHub Releases</a></li>
          <li><a href="{{v:issues_url}}">{{p:footer.issues}}</a></li>
          <li><a href="{{v:privacy_url}}">{{p:footer.privacy}}</a></li>
          <li><a href="{{v:changelog_url}}">{{p:nav.new}}</a></li>
          <li><a href="{{v:docs_url}}">{{p:footer.docs}}</a></li>
        </ul>
      </div>
      <div>
        <h2>{{p:footer.langs}}</h2>
        <div class="lang-cloud">{{@lang_cloud}}</div>
      </div>
    </div>
    <div class="foot-bottom">
      <span>{{t:footer.license}}</span>
      <span>© RideFlux contributors</span>
    </div>
  </div>
</footer>
